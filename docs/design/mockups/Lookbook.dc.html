<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotlight — lookbook</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E0E0E}a:hover{color:#C8102E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Archivo', sans-serif; color: #0E0E0E; display: flex; flex-direction: column">
  <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #0E0E0E; padding-bottom: 8px">
      <h1 style="margin: 0; font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 48px; line-height: 1; letter-spacing: -1px">Lookbook</h1>
      <span style="font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 15px; padding-bottom: 6px">4 saved</span>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px">
      <button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid #0E0E0E; background: #0E0E0E; color: #FFFFFF; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">All</button>
      <button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid #B9B6AF; background: #FFFFFF; color: #0E0E0E; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Night out</button>
      <button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid #B9B6AF; background: #FFFFFF; color: #0E0E0E; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Everyday</button>
      <button type="button" style="flex-shrink: 0; height: 36px; padding: 0 14px; border: 1px solid #B9B6AF; background: #FFFFFF; color: #0E0E0E; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Summer</button>
    </div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 16px 20px 20px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px">
      <sc-for list="{{ looks }}" as="look" hint-placeholder-count="4">
        <a href="Results.dc.html" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #0E0E0E">
          <span style="height: 220px; background: {{ look.bg }}; position: relative; overflow: hidden; display: block">
            <span style="position: absolute; left: 8px; top: 6px; font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 26px; color: #C8102E">{{ look.num }}</span>
            <svg aria-hidden="true" viewBox="0 0 100 100" style="position: absolute; left: 14px; top: 30px; width: 100px; height: 100px; transform: rotate(-6deg)"><path d="{{ look.topPath }}" fill="{{ look.topFill }}" stroke="{{ look.topStroke }}" stroke-width="0.8"></path></svg>
            <svg aria-hidden="true" viewBox="0 0 100 100" style="position: absolute; left: 82px; top: 56px; width: 80px; height: 140px; transform: rotate(5deg)"><path d="{{ look.bottomPath }}" fill="{{ look.bottomFill }}"></path></svg>
            <svg aria-hidden="true" viewBox="0 0 100 100" style="position: absolute; left: 12px; top: 136px; width: 78px; height: 78px"><path d="M8 62 Q10 50 22 52 L40 54 L54 42 Q62 40 66 46 L86 58 Q94 62 92 70 L92 76 L8 76 Z" fill="{{ look.shoeFill }}" stroke="#8E8E8E" stroke-width="0.8"></path></svg>
          </span>
          <span style="font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 17px; line-height: 1.15">{{ look.prompt }}</span>
          <span style="font-size: 12px; color: #5E5C58">{{ look.meta }}</span>
        </a>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Main" style="height: 84px; border-top: 1px solid #0E0E0E; display: flex; align-items: center; justify-content: space-around; padding: 0 8px 14px; box-sizing: border-box; background: #FFFFFF">
    <a href="Closet.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E0E0E; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M12 3v18M4 21h16"></path></svg>Closet</a>
    <a href="StylePrompt.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E0E0E; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L14 10M16 3v3M19.5 5.5l-2 2M21 10h-3M11 5l.8 1.7L13.5 7.5l-1.7.8L11 10l-.8-1.7L8.5 7.5l1.7-.8z"></path></svg>Style</a>
    <a href="Camera.dc.html" aria-label="Scan a piece" style="width: 54px; height: 54px; border-radius: 50%; background: #0E0E0E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Lookbook.dc.html" aria-current="page" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #C8102E; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Looks</a>
    <a href="Profile.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E0E0E; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Me</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const HOODIE = 'M34 16 Q50 4 66 16 L84 30 L90 82 L78 82 L74 44 L72 92 L28 92 L26 44 L22 82 L10 82 L16 30 Z';
    const SWEATER = 'M32 14 L42 10 Q50 16 58 10 L68 14 L86 30 L90 80 L78 80 L74 40 L72 90 L28 90 L26 40 L22 80 L10 80 L14 30 Z';
    const JEANS = 'M30 8 L70 8 L75 94 L56 94 L50 40 L44 94 L25 94 Z';
    const SKIRT = 'M36 14 L64 14 L66 26 L82 90 L18 90 L34 26 Z';
    return {
      looks: [
        { num: '01', prompt: '“Emo vibes”', meta: 'Hoodie · Denim · High-tops', bg: '#EDEBE7', topPath: HOODIE, topFill: '#111111', topStroke: 'none', bottomPath: JEANS, bottomFill: '#2B3F5C', shoeFill: '#111111' },
        { num: '02', prompt: '“Thrift-store brunch”', meta: 'Knit · Slip skirt · Sneakers', bg: '#E4E1DB', topPath: SWEATER, topFill: '#EFE6D2', topStroke: '#B9B6AF', bottomPath: SKIRT, bottomFill: '#6D1A2B', shoeFill: '#FFFFFF' },
        { num: '03', prompt: '“Rainy day”', meta: 'Field jacket · Denim', bg: '#E4E1DB', topPath: SWEATER, topFill: '#6B6B2A', topStroke: 'none', bottomPath: JEANS, bottomFill: '#3E5F8A', shoeFill: '#6B4423' },
        { num: '04', prompt: '“First date”', meta: 'Hoodie · Slip skirt', bg: '#EDEBE7', topPath: HOODIE, topFill: '#111111', topStroke: 'none', bottomPath: SKIRT, bottomFill: '#6D1A2B', shoeFill: '#111111' }
      ]
    };
  }
}
</script>
</body>
</html>
